# Copy this file to docker/compose.sqmu.yml for local use.
# The checked-in example uses development-only defaults. Do not place production
# secrets or private infrastructure endpoints in this file. Use docker/.env for
# local overrides, and keep docker/.env ignored.
name: sqmu

x-sqmu-labels: &sqmu-labels
  com.sqmu.repo: SQMU
  com.sqmu.stack: wordpress-release

services:
  sqmu-contracts-anvil:
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    container_name: sqmu-contracts-anvil
    labels:
      <<: *sqmu-labels
      com.sqmu.role: contracts-anvil
    command:
      - anvil
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
    ports:
      - "${SQMU_ANVIL_PORT:-8545}:8545"
    networks:
      - sqmu-release-net
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqmu-mysql-release:
    image: mysql:8.0
    container_name: sqmu-mysql-release
    labels:
      <<: *sqmu-labels
      com.sqmu.role: wordpress-database
    environment:
      MYSQL_DATABASE: ${SQMU_WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${SQMU_WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${SQMU_WORDPRESS_DB_PASSWORD:-sqmu_dev_password_change_me}
      MYSQL_ROOT_PASSWORD: ${SQMU_WORDPRESS_DB_ROOT_PASSWORD:-sqmu_root_dev_password_change_me}
    volumes:
      - sqmu-wordpress-db-data:/var/lib/mysql
    networks:
      - sqmu-release-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  sqmu-wordpress-release:
    image: wordpress:6.9.4-php8.3-apache
    container_name: sqmu-wordpress-release
    labels:
      <<: *sqmu-labels
      com.sqmu.role: wordpress
    depends_on:
      sqmu-mysql-release:
        condition: service_healthy
      sqmu-contracts-anvil:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: sqmu-mysql-release:3306
      WORDPRESS_DB_NAME: ${SQMU_WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${SQMU_WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${SQMU_WORDPRESS_DB_PASSWORD:-sqmu_dev_password_change_me}
      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');
    ports:
      - "${SQMU_WORDPRESS_PORT:-18080}:80"
    volumes:
      - sqmu-wordpress-html:/var/www/html
      - ../WordpressPlugin:/var/www/html/wp-content/plugins/sqmu
    networks:
      - sqmu-release-net

  sqmu-otterscan:
    image: otterscan/otterscan:latest
    container_name: sqmu-otterscan
    profiles:
      - explorer
    labels:
      <<: *sqmu-labels
      com.sqmu.role: chain-explorer
    depends_on:
      sqmu-contracts-anvil:
        condition: service_healthy
    environment:
      ERIGON_URL: http://sqmu-contracts-anvil:8545
    ports:
      - "${SQMU_OTTERSCAN_PORT:-5103}:80"
    networks:
      - sqmu-release-net

  sqmu-node-tools:
    image: node:24-bullseye
    container_name: sqmu-node-tools
    profiles:
      - tools
    labels:
      <<: *sqmu-labels
      com.sqmu.role: node-tools
    working_dir: /sqmu-repo
    environment:
      ANVIL_RPC_URL: http://sqmu-contracts-anvil:8545
      npm_config_cache: /home/node/.npm
    command:
      - sleep
      - infinity
    volumes:
      - ../:/sqmu-repo
      - sqmu-node-npm-cache:/home/node/.npm
    networks:
      - sqmu-release-net

networks:
  sqmu-release-net:
    name: sqmu-release-net
    labels:
      <<: *sqmu-labels
      com.sqmu.role: network

volumes:
  sqmu-wordpress-db-data:
    name: sqmu-wordpress-db-data
    labels:
      <<: *sqmu-labels
      com.sqmu.role: wordpress-database-data
  sqmu-wordpress-html:
    name: sqmu-wordpress-html
    labels:
      <<: *sqmu-labels
      com.sqmu.role: wordpress-html
  sqmu-node-npm-cache:
    name: sqmu-node-npm-cache
    labels:
      <<: *sqmu-labels
      com.sqmu.role: node-npm-cache
