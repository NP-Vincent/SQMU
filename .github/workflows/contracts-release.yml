name: Contract Bundle Release

on:
  push:
    tags:
      - 'contracts-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example contracts-v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SQMU
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SQMU/package-lock.json

      - name: Resolve release version
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          ASSET="sqmu-contract-bundle-${VERSION}.zip"
          CHECKSUM="${ASSET}.sha256"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "checksum=${CHECKSUM}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify contracts and build release bundle
        env:
          CONTRACT_BUNDLE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: npm run ci:contracts

      - name: Package bundle archive
        run: |
          cd dist/contract-bundle
          zip -qr "../${{ steps.release_meta.outputs.asset }}" .
          cd ..
          sha256sum "${{ steps.release_meta.outputs.asset }}" > "${{ steps.release_meta.outputs.checksum }}"

      - name: Create immutable release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.release_meta.outputs.version }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.release_meta.outputs.version }} already exists. Immutable releases require publishing a new contract bundle version." >&2
            exit 1
          fi

          gh release create "${{ steps.release_meta.outputs.version }}" \
            "dist/${{ steps.release_meta.outputs.asset }}" \
            "dist/${{ steps.release_meta.outputs.checksum }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.release_meta.outputs.version }}" \
            --notes "Versioned SQMU contract deployment bundle."

      - name: Switch to main for plugin pin update
        working-directory: .
        run: |
          git fetch origin main
          git switch -C main origin/main

      - name: Update plugin contract bundle pin
        working-directory: .
        run: |
          node .github/scripts/update-contract-bundle-pin.cjs \
            --file WordpressPlugin/contract-bundle.json \
            --version "${{ steps.release_meta.outputs.version }}" \
            --tag "${{ steps.release_meta.outputs.version }}" \
            --asset "${{ steps.release_meta.outputs.asset }}" \
            --checksum-file "SQMU/dist/${{ steps.release_meta.outputs.checksum }}"

      - name: Commit plugin contract bundle pin
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WordpressPlugin/contract-bundle.json
          if git diff --cached --quiet; then
            echo "No plugin contract bundle pin changes to commit."
            exit 0
          fi
          git commit -m "chore: pin contract bundle ${{ steps.release_meta.outputs.version }}"
          git push origin HEAD:main
