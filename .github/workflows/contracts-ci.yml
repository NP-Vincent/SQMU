name: Contracts CI

on:
  pull_request:
    paths:
      - '.github/workflows/contracts-ci.yml'
      - '.github/workflows/contracts-release.yml'
      - 'SQMU/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/contracts-ci.yml'
      - '.github/workflows/contracts-release.yml'
      - 'SQMU/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SQMU
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SQMU/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify contracts and build bundle preview
        env:
          CONTRACT_BUNDLE_VERSION: preview-${{ github.sha }}
        run: npm run ci:contracts

      - name: Start Anvil
        run: docker run -d --rm --name sqmu-anvil ghcr.io/foundry-rs/foundry:latest anvil --host 0.0.0.0 --chain-id 31337

      - name: Wait for Anvil
        run: |
          for attempt in $(seq 1 20); do
            if docker exec sqmu-anvil cast chain-id >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Anvil did not become ready in time" >&2
          exit 1

      - name: Smoke deploy bundle to Anvil
        run: |
          docker run --rm \
            --network container:sqmu-anvil \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/SQMU \
            -e ANVIL_RPC_URL=http://127.0.0.1:8545 \
            node:22-bullseye \
            sh -lc "npm run smoke:deploy:anvil"

      - name: Stop Anvil
        if: always()
        run: docker stop sqmu-anvil

      - name: Upload contract bundle preview
        uses: actions/upload-artifact@v6
        with:
          name: sqmu-contract-bundle-preview
          path: SQMU/dist/contract-bundle

      - name: Upload Anvil smoke report
        uses: actions/upload-artifact@v6
        with:
          name: sqmu-anvil-smoke-report
          path: SQMU/dist/anvil-smoke-report.json
