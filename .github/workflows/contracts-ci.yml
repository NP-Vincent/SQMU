name: Contracts CI

on:
  pull_request:
    paths:
      - '.github/workflows/contracts-ci.yml'
      - '.github/workflows/contracts-release.yml'
      - 'SQMU/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/contracts-ci.yml'
      - '.github/workflows/contracts-release.yml'
      - 'SQMU/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SQMU
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: SQMU/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify contracts and build bundle preview
        env:
          CONTRACT_BUNDLE_VERSION: preview-${{ github.sha }}
        run: npm run ci:contracts

      - name: Start Anvil
        run: docker compose -f ../docker/compose.sqmu.example.yml up -d sqmu-contracts-anvil

      - name: Wait for Anvil
        run: |
          for attempt in $(seq 1 20); do
            if docker exec sqmu-contracts-anvil cast chain-id >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "Anvil did not become ready in time" >&2
          exit 1

      - name: Smoke deploy bundle to Anvil
        env:
          ANVIL_RPC_URL: http://127.0.0.1:8545
        run: npm run smoke:deploy:anvil

      - name: Stop Anvil
        if: always()
        run: docker compose -f ../docker/compose.sqmu.example.yml down

      - name: Upload contract bundle preview
        uses: actions/upload-artifact@v6
        with:
          name: sqmu-contract-bundle-preview
          path: SQMU/dist/contract-bundle

      - name: Upload Anvil smoke report
        uses: actions/upload-artifact@v6
        with:
          name: sqmu-contracts-anvil-smoke-report
          path: SQMU/dist/anvil-smoke-report.json
